name: Release Windows app

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set version from tag
        shell: bash
        # package.json 이 이미 같은 버전이면 `npm version` 이 실패한다.
        # 태그가 정본이므로 그냥 값을 덮어 쓴다.
        run: npm pkg set "version=${GITHUB_REF_NAME#v}"

      - name: Build and publish Windows release
        run: npm run build && npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
